<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审核员资质查询系统</title>
<style>
:root {
  --bg: #eef2f7;
  --surface: rgba(255, 255, 255, 0.92);
  --surface2: rgba(241, 245, 249, 0.9);
  --border: #cbd5e1;
  --text: #1e293b;
  --text-dim: #64748b;
  --accent: #0284c7;
  --accent2: #6366f1;
  --green: #16a34a;
  --yellow: #ca8a04;
  --red: #dc2626;
  --orange: #ea580c;
  --purple: #9333ea;
  --pink: #db2777;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: #4a90d9 url('xp_bg.jpg') no-repeat center top fixed;
  background-size: cover;
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1200px; margin: 0 auto; }
header {
  text-align: center;
  padding: 28px 20px 20px;
  background: linear-gradient(135deg, #ffffff 0%, #f0f4fa 100%);
  border-radius: 16px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
header h1 {
  font-size: 28px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.update-time { color: var(--text-dim); font-size: 13px; }

.warning-banner {
  background: linear-gradient(135deg, rgba(220,38,38,0.06) 0%, rgba(220,38,38,0.03) 100%);
  border: 1px solid rgba(220,38,38,0.25);
  border-radius: 12px;
  padding: 12px 20px;
  margin-bottom: 16px;
  text-align: center;
}
.warning-banner .line {
  color: var(--red);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.8;
}
.warning-banner .line.dim {
  font-weight: 400;
  font-size: 13px;
  opacity: 0.85;
}

.search-section {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.search-box {
  display: flex;
  gap: 12px;
  align-items: center;
}
.search-input {
  flex: 1;
  padding: 14px 20px;
  font-size: 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--surface2);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-dim); }
.search-btn {
  padding: 14px 28px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.search-btn:hover { opacity: 0.9; }
.search-hint {
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-dim);
}
.search-hint code {
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--accent);
  font-size: 12px;
}

.results-section { display: flex; flex-direction: column; gap: 20px; }
.result-card {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  padding: 24px;
  animation: fadeIn 0.3s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.result-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.person-name {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
}
.person-name .en { color: var(--accent); }
.person-name .cn { color: var(--accent2); margin-left: 12px; }
.person-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.meta-tag {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--surface2);
  color: var(--text-dim);
}
.meta-tag.auditor-num {
  background: rgba(2,132,199,0.12);
  color: var(--accent);
  font-size: 15px;
  font-weight: 700;
  padding: 5px 14px;
  border: 1px solid rgba(2,132,199,0.3);
}
.meta-tag.status { background: rgba(74,222,128,0.15); color: var(--green); }
.meta-tag.status.suspended { background: rgba(248,113,113,0.15); color: var(--red); }
.meta-tag.area { background: rgba(129,140,248,0.15); color: var(--accent2); }
.meta-tag.level { background: rgba(192,132,252,0.15); color: var(--purple); }

.copy-btn {
  padding: 6px 14px;
  font-size: 13px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied { background: var(--green); color: #fff; border-color: var(--green); }

.info-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.info-block {
  background: var(--surface2);
  border-radius: 12px;
  padding: 16px;
  border: 1px solid var(--border);
}
.info-block-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.info-block-title .icon {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.info-block-title.fssc .icon { background: var(--green); }
.info-block-title.haccp .icon { background: var(--yellow); }
.info-block-title.qms .icon { background: var(--accent); }
.info-block-title.ems .icon { background: var(--orange); }
.info-block-title.ohsas .icon { background: var(--red); }
.info-block-title.ccaa .icon { background: var(--purple); }
.info-block-title.fssc { color: var(--green); }
.info-block-title.haccp { color: var(--yellow); }
.info-block-title.qms { color: var(--accent); }
.info-block-title.ems { color: var(--orange); }
.info-block-title.ohsas { color: var(--red); }
.info-block-title.ccaa { color: var(--purple); }

.code-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.code-tag {
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 6px;
  font-family: 'Consolas', 'Monaco', monospace;
  cursor: pointer;
  transition: all 0.15s;
}
.code-tag.fssc { background: rgba(22,163,74,0.1); color: var(--green); border: 1px solid rgba(22,163,74,0.25); }
.code-tag.fssc.iso { background: rgba(2,132,199,0.1); color: var(--accent); border: 1px solid rgba(2,132,199,0.25); }
.code-tag.haccp { background: rgba(202,138,4,0.1); color: var(--yellow); border: 1px solid rgba(202,138,4,0.25); }
.code-tag.qms { background: rgba(2,132,199,0.1); color: var(--accent); border: 1px solid rgba(2,132,199,0.25); }
.code-tag.ems { background: rgba(234,88,12,0.1); color: var(--orange); border: 1px solid rgba(234,88,12,0.25); }
.code-tag.ohsas { background: rgba(220,38,38,0.1); color: var(--red); border: 1px solid rgba(220,38,38,0.25); }
.code-tag:hover { transform: scale(1.05); }
.code-tag .scope-label {
  font-size: 10px;
  opacity: 0.7;
  margin-left: 4px;
}

.ccaa-table { width: 100%; border-collapse: collapse; }
.ccaa-table th, .ccaa-table td {
  padding: 10px 12px;
  text-align: left;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.ccaa-table th { color: var(--text-dim); font-weight: 600; }
.ccaa-table td { color: var(--text); }
.ccaa-table td.reg-num {
  font-family: 'Consolas', 'Monaco', monospace;
  color: var(--purple);
  font-size: 16px;
  font-weight: 600;
}
.ccaa-table td.domain-cell {
  color: var(--text-dim);
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  cursor: default;
}
.ccaa-table tr:last-child td { border-bottom: none; }

.ccaa-copy-btn {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  font-size: 11px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
  vertical-align: middle;
}
.ccaa-copy-btn:hover { border-color: var(--purple); color: var(--purple); }
.ccaa-copy-btn.copied { background: var(--green); color: #fff; border-color: var(--green); }

.no-data { color: var(--text-dim); font-size: 13px; font-style: italic; }

.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.no-results .icon { font-size: 48px; margin-bottom: 16px; }
.no-results .msg { font-size: 18px; margin-bottom: 8px; }
.no-results .sub { font-size: 14px; }

footer {
  text-align: center;
  padding: 16px;
  color: var(--text-dim);
  font-size: 12px;
  margin-top: 24px;
}
footer a { color: var(--accent); text-decoration: none; }

/* ===== 牛马在路上 动画 ===== */
.cowhorse-road {
  height: 56px;
  margin: 0 auto 16px;
  max-width: 320px;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  background: linear-gradient(180deg, rgba(241,245,249,0.8) 0%, rgba(226,232,240,0.5) 100%);
  border: 1px solid rgba(203,213,225,0.6);
}
.cowhorse-road .ground {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(100,116,139,0.3), transparent);
}
.cowhorse-road .road-line {
  position: absolute;
  bottom: 14px;
  left: 0;
  right: 0;
  height: 1px;
  background-image: repeating-linear-gradient(90deg, rgba(100,116,139,0.2) 0, rgba(100,116,139,0.2) 8px, transparent 8px, transparent 20px);
  animation: road-scroll 0.6s linear infinite;
}
@keyframes road-scroll { from { background-position-x: 0; } to { background-position-x: -20px; } }

.cowhorse-runner {
  position: absolute;
  bottom: 14px;
  font-size: 28px;
  animation: run-right 4s ease-in-out infinite;
}
@keyframes run-right {
  0% { left: -5%; transform: scaleX(1); }
  48% { left: 88%; transform: scaleX(1); }
  50% { left: 88%; transform: scaleX(-1); }
  98% { left: -5%; transform: scaleX(-1); }
  100% { left: -5%; transform: scaleX(1); }
}
.cowhorse-runner .body { display: inline-block; animation: bounce 0.35s ease-in-out infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-3px); } }

.cowhorse-label {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--text-dim);
  opacity: 0.6;
  letter-spacing: 1px;
}

.match-list-item {
  cursor: pointer;
  transition: border-color 0.2s;
}
.match-list-item:hover {
  border-color: var(--accent);
}

@media (max-width: 768px) {
  .search-box { flex-direction: column; }
  .search-btn { width: 100%; }
  header h1 { font-size: 22px; }
  .person-name { font-size: 18px; }
  .result-card { padding: 16px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>审核员资质查询系统</h1>
    <div class="update-time">数据更新时间: <span id="update-time">-</span></div>
  </header>

  <div class="warning-banner">
    <div class="line">不负责准确性，仅供快速查询参考</div>

  <div class="cowhorse-road">
    <span class="cowhorse-label">牛马在路上</span>
    <div class="road-line"></div>
    <div class="ground"></div>
    <span class="cowhorse-runner"><span class="body">&#128046;</span></span>
  </div>

  <div class="search-section">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="输入审核员中文姓名或英文姓名..." autofocus>

  </div>

  <div class="results-section" id="results">
    <div class="no-results">
      <div class="icon">&#128269;</div>
      <div class="msg">请输入姓名开始查询</div>
      <div class="sub" style="display:none">系统已加载全部审核员资质数据</div>
    </div>
  </div>

  <footer>
    <div>本系统仅供内部参考使用</div>
  </footer>
</div>

document.getElementById('update-time').textContent = DATA.update_time;

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

function doSearch() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  var resultsDiv = document.getElementById('results');

  if (!query) {
    resultsDiv.innerHTML = '<div class="no-results"><div class="icon">&#128269;</div><div class="msg">请输入姓名开始查询</div></div>';
    return;
  }

  var matches = DATA.persons.filter(function(p) {
    if (p.en_name && p.en_name.toLowerCase().indexOf(query) !== -1) return true;
    if (p.cn_name && p.cn_name.toLowerCase().indexOf(query) !== -1) return true;
    if (p.auditor_number && p.auditor_number.toLowerCase().indexOf(query) !== -1) return true;
    if (p.search_terms) {
      for (var i = 0; i < p.search_terms.length; i++) {
        if (p.search_terms[i].indexOf(query) !== -1) return true;
      }
    }
    if (p.ccaa_registrations) {
      for (var j = 0; j < p.ccaa_registrations.length; j++) {
        if (p.ccaa_registrations[j].reg_number &&
            p.ccaa_registrations[j].reg_number.toLowerCase().indexOf(query) !== -1) return true;
      }
    }
    return false;
  });

  if (matches.length === 0) {
    resultsDiv.innerHTML = '<div class="no-results"><div class="icon">&#128270;</div><div class="msg">未找到匹配的审核员</div><div class="sub">请检查姓名拼写或尝试其他关键词</div></div>';
    return;
  }

  if (matches.length === 1) {
    resultsDiv.innerHTML = renderPerson(matches[0]);
    return;
  }

  var html = '<div class="no-results" style="padding:20px"><div class="msg" style="font-size:16px">找到 ' + matches.length + ' 位匹配的审核员，请选择：</div></div>';
  matches.forEach(function(p, i) {
    var num = p.auditor_number || '';
    var domains = p.ccaa_registrations.map(function(c) { return c.domain; }).join(', ');
    html += '<div class="result-card match-list-item" style="padding:16px" onclick="selectPerson(' + i + ')">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div><div class="person-name" style="font-size:18px"><span class="en">' + esc(p.en_name) + '</span>' +
      (p.cn_name ? '<span class="cn">' + esc(p.cn_name) + '</span>' : '') + '</div>' +
      '<div class="person-meta">' + (num ? '<span class="meta-tag auditor-num">No.' + esc(num) + '</span>' : '') +
      (domains ? '<span class="meta-tag">' + esc(domains) + '</span>' : '') + '</div></div>' +
      '<div style="color:var(--text-dim);font-size:20px">&#10095;</div></div></div>';
  });
  resultsDiv.innerHTML = html;
  window._matches = matches;
}

function selectPerson(idx) {
  document.getElementById('results').innerHTML = renderPerson(window._matches[idx]);
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderPerson(p) {
  var html = '<div class="result-card">';

  html += '<div class="result-header">';
  html += '<div>';
  html += '<div class="person-name">';
  if (p.en_name) html += '<span class="en">' + esc(p.en_name) + '</span>';
  if (p.cn_name) html += '<span class="cn">' + esc(p.cn_name) + '</span>';
  if (!p.en_name && !p.cn_name && p.raw_names.length > 0) html += '<span class="cn">' + esc(p.raw_names[0]) + '</span>';
  html += '</div>';
  html += '<div class="person-meta">';
  if (p.auditor_number) html += '<span class="meta-tag auditor-num">Auditor No. ' + esc(p.auditor_number) + '</span>';
  if (p.status) {
    var isSuspended = p.status.toLowerCase().indexOf('suspend') !== -1;
    html += '<span class="meta-tag status' + (isSuspended ? ' suspended' : '') + '">' + esc(p.status) + '</span>';
  }
  if (p.area) html += '<span class="meta-tag area">' + esc(p.area) + '</span>';
  if (p.level) html += '<span class="meta-tag level">' + esc(p.level) + '</span>';
  html += '</div>';
  html += '</div>';
  html += '<button class="copy-btn" onclick="copyResult(this)">复制全部信息</button>';
  html += '</div>';

  html += '<div class="info-grid">';

  // FSSC
  html += '<div class="info-block">';
  html += '<div class="info-block-title fssc"><span class="icon"></span>FSSC / ISO 22000 CODE (' + p.fssc_codes.length + ')</div>';
  if (p.fssc_codes.length > 0) {
    html += '<div class="code-tags">';
    p.fssc_codes.forEach(function(c) {
      var isISO = c.scope === 'ISO 22000';
      html += '<span class="code-tag fssc' + (isISO ? ' iso' : '') + '" title="' + esc(c.category) + '">' + esc(c.code) + '<span class="scope-label">' + (isISO ? 'ISO' : 'FSSC') + '</span></span>';
    });
    html += '</div>';
  } else {
    html += '<div class="no-data">无 FSSC CODE 数据</div>';
  }
  html += '</div>';

  // HACCP
  html += '<div class="info-block">';
  html += '<div class="info-block-title haccp"><span class="icon"></span>HACCP CNAS CODE (' + p.haccp_codes.length + ')</div>';
  if (p.haccp_codes.length > 0) {
    html += '<div class="code-tags">';
    p.haccp_codes.forEach(function(c) {
      html += '<span class="code-tag haccp" title="' + esc(c.category) + '">' + esc(c.code) + '</span>';
    });
    html += '</div>';
  } else {
    html += '<div class="no-data">无 HACCP CODE 数据</div>';
  }
  html += '</div>';

  // QMS
  html += '<div class="info-block">';
  html += '<div class="info-block-title qms"><span class="icon"></span>QMS CODE (' + p.qms_codes.length + ')</div>';
  if (p.qms_codes.length > 0) {
    html += '<div class="code-tags">';
    p.qms_codes.forEach(function(c) {
      html += '<span class="code-tag qms" title="' + esc(c.category) + '">' + esc(c.code) + '</span>';
    });
    html += '</div>';
  } else {
    html += '<div class="no-data">无 QMS CODE 数据</div>';
  }
  html += '</div>';

  // EMS
  html += '<div class="info-block">';
  html += '<div class="info-block-title ems"><span class="icon"></span>EMS CODE (' + p.ems_codes.length + ')</div>';
  if (p.ems_codes.length > 0) {
    html += '<div class="code-tags">';
    p.ems_codes.forEach(function(c) {
      html += '<span class="code-tag ems" title="' + esc(c.category) + '">' + esc(c.code) + '</span>';
    });
    html += '</div>';
  } else {
    html += '<div class="no-data">无 EMS CODE 数据</div>';
  }
  html += '</div>';

  // OHSAS
  html += '<div class="info-block">';
  html += '<div class="info-block-title ohsas"><span class="icon"></span>OHSAS CODE (' + p.ohsas_codes.length + ')</div>';
  if (p.ohsas_codes.length > 0) {
    html += '<div class="code-tags">';
    p.ohsas_codes.forEach(function(c) {
      html += '<span class="code-tag ohsas" title="' + esc(c.category) + '">' + esc(c.code) + '</span>';
    });
    html += '</div>';
  } else {
    html += '<div class="no-data">无 OHSAS CODE 数据</div>';
  }
  html += '</div>';

  // CCAA
  html += '<div class="info-block">';
  html += '<div class="info-block-title ccaa"><span class="icon"></span>CCAA 注册号 (' + p.ccaa_registrations.length + ')</div>';
  if (p.ccaa_registrations.length > 0) {
    html += '<table class="ccaa-table"><thead><tr><th>注册领域</th><th>CCAA注册号</th></tr></thead><tbody>';
    p.ccaa_registrations.forEach(function(c, idx) {
      html += '<tr><td class="domain-cell">' + esc(c.domain) + '</td><td class="reg-num">' + esc(c.reg_number) + '<button class="ccaa-copy-btn" onclick="copyCCAA(this,' + idx + ')" data-reg="' + esc(c.reg_number) + '">复制</button></td></tr>';
    });
    html += '</tbody></table>';
    if (p.ccaa_registrations.length > 1) {
      var allRegs = p.ccaa_registrations.map(function(c) { return c.reg_number; }).join('\n');
      html += '<div style="margin-top:8px"><button class="ccaa-copy-btn" style="font-size:12px;padding:4px 12px" onclick="copyCCAAAll(this)" data-all="' + esc(allRegs) + '">一键复制全部注册号</button></div>';
    }
  } else {
    html += '<div class="no-data">无 CCAA 注册号数据</div>';
  }
  html += '</div>';

  html += '</div>';
  html += '</div>';
  return html;
}

function copyResult(btn) {
  var card = btn.closest('.result-card');
  if (!card) return;

  var text = '';
  var nameEl = card.querySelector('.person-name');
  if (nameEl) text += nameEl.textContent.trim() + '\n';

  var metaTags = card.querySelectorAll('.person-meta .meta-tag');
  metaTags.forEach(function(t) { text += t.textContent.trim() + '  '; });
  text += '\n\n';

  var blocks = card.querySelectorAll('.info-block');
  blocks.forEach(function(block) {
    var title = block.querySelector('.info-block-title');
    if (title) text += '\n=== ' + title.textContent.trim() + ' ===\n';

    var table = block.querySelector('.ccaa-table');
    if (table) {
      var rows = table.querySelectorAll('tbody tr');
      rows.forEach(function(row) {
        var regCell = row.querySelector('.reg-num');
        if (regCell) text += regCell.textContent.trim() + '\n';
      });
    } else {
      var tags = block.querySelectorAll('.code-tag');
      var codeTexts = [];
      tags.forEach(function(t) { codeTexts.push(t.textContent.trim()); });
      if (codeTexts.length > 0) text += codeTexts.join(', ') + '\n';
      else {
        var nd = block.querySelector('.no-data');
        if (nd) text += nd.textContent.trim() + '\n';
      }
    }
  });

  function showCopied() {
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = '复制全部信息';
      btn.classList.remove('copied');
    }, 2000);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showCopied).catch(function() {
      fallbackCopy(text);
      showCopied();
    });
  } else {
    fallbackCopy(text);
    showCopied();
  }
}

function fallbackCopy(text) {
  var textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(textarea);
}

function copyCCAA(btn, idx) {
  var reg = btn.getAttribute('data-reg');
  function done() {
    var orig = btn.textContent;
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(reg).then(done).catch(function() { fallbackCopy(reg); done(); });
  } else {
    fallbackCopy(reg); done();
  }
}

function copyCCAAAll(btn) {
  var all = btn.getAttribute('data-all');
  function done() {
    btn.textContent = '已复制全部';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = '一键复制全部注册号'; btn.classList.remove('copied'); }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(all).then(done).catch(function() { fallbackCopy(all); done(); });
  } else {
    fallbackCopy(all); done();
  }
}
</script>
